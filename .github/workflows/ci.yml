name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # القيم دي وهمية بس لغرض الـ build في الـ CI (مش بتتصل بأي مشروع
          # Firebase حقيقي). القيم الحقيقية بتتحط كـ Secrets في GitHub
          # Settings > Secrets and variables > Actions لو حبيت تعمل deploy فعلي.
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'
          VITE_ENCRYPTION_KEY: ci-placeholder-key-not-for-production

      - name: Run tests
        run: npx vitest run
